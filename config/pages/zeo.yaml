page:
  code: ZEO
  display_name: "ZEO / Zeolite & Thủy sản"
  brand: "Zeolite"

ai:
  enabled: false # Bật sau khi hoàn thành test handoff và go-live gate
  provider: ollama
  model: qwen2.5:7b
  language: vi
  max_response_chars: 450
  temperature: 0.1

messaging:
  debounce_seconds: 5.0
  max_batch_seconds: 20.0

knowledge:
  namespace: zeo
  allowed_categories:
    - zeolite_aquaculture
    - detergent_chemical
    - zeo_faq

workflows:
  - PRICE_INQUIRY
  - DEALER_LOOKUP
  - PRODUCT_INQUIRY
  - AGRI_ADVICE
  - HUMAN_REQUEST

pricing:
  mode: HUMAN_HANDOFF # BẮT BUỘC: Không bao giờ tự báo giá
  policy: "Tất cả yêu cầu báo giá chuyển cho nhân viên kinh doanh xử lý."
